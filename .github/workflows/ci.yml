name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Build ship-go interop harness
        working-directory: interop/ship-go-harness
        run: |
          go get github.com/enbility/ship-go@a84426bc38105a14b50dad23c0615bff0430af7b
          go mod tidy
          go build -o harness .
      - name: Build eebus-go interop harness
        working-directory: interop/eebus-go-harness
        run: |
          ./fetch-deps.sh
          go mod tidy
          go build -o harness .
      - run: pip install -e ".[test]"
      - run: pytest
        env:
          SHIP_GO_HARNESS: ${{ github.workspace }}/interop/ship-go-harness/harness
          EEBUS_GO_HARNESS: ${{ github.workspace }}/interop/eebus-go-harness/harness
