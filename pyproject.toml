[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyeebus"
version = "0.1.0.dev0"
description = "EEBUS (SHIP and SPINE) for Python, ported from the enbility Go implementation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Frane Bandov" }]
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.9",
  "cryptography>=42",
  "zeroconf>=0.131",
]
keywords = ["eebus", "ship", "spine", "hems", "wallbox", "energy-management"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Framework :: AsyncIO",
  "Programming Language :: Python :: 3",
  "Topic :: Home Automation",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/frane/pyeebus"

[project.scripts]
pyeebus = "pyeebus.cli:main"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["src/pyeebus"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
